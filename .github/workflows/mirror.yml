name: Mirror Dockerhub

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'images/**'
  schedule:
    - cron: '0 0 * * *'

jobs:
  get-images:
    name: Get Images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set-matrix
        run: |
          echo "matrix=$(find images -type f -printf '%P\n' | jq -R '{"image": .}' | jq -cs '{"include": .}')" >> $GITHUB_OUTPUT

  mirror:
    name: Mirror
    needs: get-images
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.get-images.outputs.matrix) }}
      fail-fast: false # Allows other jobs to continue if one fails

    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: actions/setup-go@v6
        with:
          cache: false # Prevents the "go.sum not found" warning
      - uses: imjasonh/setup-crane@v0.5
      - name: Mirror
        env:
          DOCKERHUB_RO: ${{ secrets.DOCKERHUB_RO }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          repo="docker.io"
          if [[ "${{ matrix.image }}" == "n8nio/n8n" ]]; then
            repo="docker.n8n.io"
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Mirroring: ${{ matrix.image }}"
          echo "Source: $repo/${{ matrix.image }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          # setup-crane ends with `crane auth login ghcr.io` using the ephemeral
          # GITHUB_TOKEN, clobbering the GHCR_PAT credential that
          # docker/login-action wrote above. GITHUB_TOKEN can only write packages
          # linked to this repo, so packages with no repo linkage (copyparty/ac,
          # vimagick/tinyproxy) fail with 403 / DENIED. Re-assert GHCR_PAT here.
          if [[ -z "${GHCR_PAT}" ]]; then
            echo "::error::GHCR_PAT secret is empty — pushes to unlinked packages would fail"
            exit 1
          fi
          echo "${GHCR_PAT}" | crane auth login ghcr.io --username "${{ github.repository_owner }}" --password-stdin

          # Docker Hub credentials must be keyed to the host crane actually
          # resolves (index.docker.io), not registry.docker.com. Without this,
          # every pull is anonymous and eventually hits TOOMANYREQUESTS.
          if [[ -z "${DOCKERHUB_RO}" ]]; then
            echo "::error::DOCKERHUB_RO secret is empty — pulls would be anonymous and rate-limited"
            exit 1
          fi
          echo "${DOCKERHUB_RO}" | crane auth login index.docker.io --username psarossy --password-stdin

          # docker.n8n.io is a Docker Hub vanity domain; crane scopes auth per
          # host, so it needs its own login or it stays anonymous.
          if [[ "$repo" != "docker.io" ]]; then
            echo "${DOCKERHUB_RO}" | crane auth login "$repo" --username psarossy --password-stdin
          fi

          # Initialize counters
          TOTAL=0
          COPIED=0
          SKIPPED=0
          FAILED=0

          for tag in $(cat ./images/${{ matrix.image }}); do
            TOTAL=$((TOTAL + 1))
            SRC_IMAGE="$repo/${{ matrix.image }}:$tag"
            DEST_IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:$tag"

            echo "Processing tag: $tag"

            # Get the digest of the source image with retry logic
            RETRY_COUNT=0
            MAX_RETRIES=3
            # NB: `continue 2` skips to the next tag. A bare `continue` would only
            # continue this inner retry loop, which then exits on its own
            # condition and falls through to attempt a copy we know will fail --
            # double-counting one tag as two failures.
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              SRC_DIGEST=$(crane digest $SRC_IMAGE 2>/dev/null) && break
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "  ⚠️  Failed to get source digest, retrying ($RETRY_COUNT/$MAX_RETRIES)..."
                sleep $((2 ** RETRY_COUNT))
              else
                echo "  ❌ Failed to get source digest after $MAX_RETRIES attempts"
                FAILED=$((FAILED + 1))
                continue 2
              fi
            done

            # Get the digest of the destination image
            DEST_DIGEST=$(crane digest $DEST_IMAGE 2>/dev/null || true)

            if [ "$SRC_DIGEST" != "$DEST_DIGEST" ]; then
              echo "  📦 Copying (digest differs or doesn't exist at destination)"

              # Copy with retry logic
              RETRY_COUNT=0
              while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                if crane copy "$SRC_IMAGE" "$DEST_IMAGE" 2>&1; then
                  echo "  ✅ Successfully copied"
                  COPIED=$((COPIED + 1))
                  break
                fi
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "  ⚠️  Copy failed, retrying ($RETRY_COUNT/$MAX_RETRIES)..."
                  sleep $((2 ** RETRY_COUNT))
                else
                  echo "  ❌ Failed to copy after $MAX_RETRIES attempts"
                  FAILED=$((FAILED + 1))
                fi
              done
            else
              echo "  ⏭️  Skipped (digest unchanged)"
              SKIPPED=$((SKIPPED + 1))
            fi
            echo ""
          done

          # Print summary
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Summary for ${{ matrix.image }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Total tags: $TOTAL"
          echo "✅ Copied: $COPIED"
          echo "⏭️  Skipped: $SKIPPED"
          echo "❌ Failed: $FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Write to job summary
          echo "### Mirror Results: \`${{ matrix.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tags | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Copied | $COPIED |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Exit with error if any tags failed
          if [ $FAILED -gt 0 ]; then
            echo "::error::Failed to mirror $FAILED tag(s) for ${{ matrix.image }}"
            exit 1
          fi

  summary:
    name: Mirror Summary
    needs: [get-images, mirror]
    runs-on: ubuntu-latest
    if: always()
    # actions:read is needed to count per-image job conclusions and to read the
    # recent run history for the consecutive-failure streak below.
    permissions:
      actions: read
    steps:
      # `needs.mirror.result` collapses a 73-job matrix into one word, so
      # "3 of 73 images failed" and "the mirror is completely dead" produced an
      # identical red alert. That ambiguity is why a nightly red alert went
      # unactioned for ~8 weeks (2026-07-03 -> 2026-08-30): it always looked the
      # same, so it stopped carrying information. Grade the severity by how many
      # images actually failed, and name them.
      - name: Collect results
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          gh api "/repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.name | startswith("Mirror (")) | [.conclusion, (.name | capture("Mirror \\((?<i>.*)\\)").i)] | @tsv' \
            > jobs.tsv

          TOTAL=$(wc -l < jobs.tsv | tr -d ' ')
          FAILED_IMAGES=$(awk -F'\t' '$1 != "success" { print $2 }' jobs.tsv | sort)
          FAILED=$(printf '%s' "$FAILED_IMAGES" | grep -c . || true)

          # Consecutive failed runs BEFORE this one. The current run is still
          # in_progress while this job executes, so it is absent from the list.
          WF=$(gh api "/repos/${REPO}/actions/runs/${RUN_ID}" --jq '.workflow_id')
          STREAK=$(gh api "/repos/${REPO}/actions/workflows/${WF}/runs?per_page=100&status=completed" \
            --jq '[.workflow_runs[].conclusion]' \
            | jq -r 'map(select(. != null)) | (index("success") // length)')

          {
            echo "total=${TOTAL}"
            echo "failed=${FAILED}"
            echo "streak=${STREAK}"
            echo "failed_images<<EOF"
            printf '%s\n' "${FAILED_IMAGES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Summary
        env:
          TOTAL: ${{ steps.collect.outputs.total }}
          FAILED: ${{ steps.collect.outputs.failed }}
          STREAK: ${{ steps.collect.outputs.streak }}
          FAILED_IMAGES: ${{ steps.collect.outputs.failed_images }}
        run: |
          {
            echo "# DockerHub Mirror - Workflow Summary"
            echo ""
            echo "**Workflow Run:** ${{ github.run_number }}"
            echo "**Triggered by:** ${{ github.event_name }}"
            echo "**Branch:** ${{ github.ref_name }}"
            echo ""
            if [ "$FAILED" -eq 0 ]; then
              echo "## ✅ Success — all ${TOTAL} images mirrored"
            elif [ "$FAILED" -ge "$TOTAL" ]; then
              echo "## 🚨 TOTAL FAILURE — all ${TOTAL} images failed"
              echo ""
              echo "Every image failed. Suspect auth or a registry outage, not individual images."
            else
              echo "## ⚠️ Partial — ${FAILED} of ${TOTAL} images failed"
            fi
            if [ "$FAILED" -gt 0 ]; then
              echo ""
              echo "### Failed images"
              printf '%s\n' "$FAILED_IMAGES" | sed 's/^/- `/; s/$/`/'
              if [ "${STREAK:-0}" -gt 0 ]; then
                echo ""
                echo "**⏳ This has failed ${STREAK} consecutive run(s) before this one.**"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord
        if: vars.DISCORD_CI_WEBHOOK != ''
        env:
          WEBHOOK_URL: ${{ vars.DISCORD_CI_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          TOTAL: ${{ steps.collect.outputs.total }}
          FAILED: ${{ steps.collect.outputs.failed }}
          STREAK: ${{ steps.collect.outputs.streak }}
          FAILED_IMAGES: ${{ steps.collect.outputs.failed_images }}
        run: |
          if [ "$FAILED" -eq 0 ]; then
            COLOR=3066993   # green
            TITLE="✅ Mirror #${RUN_NUMBER} — all ${TOTAL} images OK"
            DESC="All images mirrored successfully."
          elif [ "$FAILED" -ge "$TOTAL" ]; then
            COLOR=15158332  # red
            TITLE="🚨 Mirror #${RUN_NUMBER} — TOTAL FAILURE (${FAILED}/${TOTAL})"
            DESC="Every image failed. Suspect auth or a registry outage, not individual images."
          else
            COLOR=16098851  # amber — a partial failure is not an outage
            TITLE="⚠️ Mirror #${RUN_NUMBER} — ${FAILED} of ${TOTAL} images failed"
            DESC="$(printf '%s\n' "$FAILED_IMAGES" | sed 's/^/• /')"
          fi

          # A repeat failure is a different problem from a first failure. Saying
          # so in the title is what stops a recurring alert reading as routine.
          if [ "${STREAK:-0}" -gt 0 ] && [ "$FAILED" -gt 0 ]; then
            TITLE="${TITLE} — ${STREAK} runs in a row"
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg url "$RUN_URL" \
            --arg trigger "$EVENT_NAME" \
            --argjson color "$COLOR" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: $color, footer: {text: ("Triggered by " + $trigger)}, timestamp: (now | todate)}]}')

          curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL"
